<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scarselli | Fine Diamond Jewellery Atelier New York</title>
    <meta name="description" content="Scarselli is a private fine diamond jewellery atelier on Fifth Avenue in New York, specializing in certified lab-grown diamonds, bespoke engagement rings, and private viewing appointments." />
    <meta property="og:title" content="Scarselli | Fine Diamond Jewellery Atelier New York" />
    <meta property="og:description" content="Scarselli is a private fine diamond jewellery atelier on Fifth Avenue in New York, specializing in certified lab-grown diamonds, bespoke engagement rings, and private viewing appointments." />
    <meta property="og:site_name" content="Scarselli" />
    <meta property="og:image" content="./images/scarselli-hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scarselli | Fine Diamond Jewellery Atelier New York" />
    <meta name="twitter:description" content="Scarselli is a private fine diamond jewellery atelier on Fifth Avenue in New York, specializing in certified lab-grown diamonds, bespoke engagement rings, and private viewing appointments." />
    <meta name="twitter:image" content="./images/scarselli-hero.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "JewelryStore",
      "name": "Scarselli",
      "image": "./images/scarselli-hero.jpg",
      "telephone": "+1-917-880-1797",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "580 Fifth Avenue, Suite 821",
        "addressLocality": "New York",
        "addressRegion": "NY",
        "postalCode": "10017",
        "addressCountry": "US"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "10:00",
          "closes": "18:00"
        }
      ],
      "priceRange": "$$$$"
    }
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#141A24] antialiased selection:bg-[#C5A880]/20 selection:text-[#0B1320]">
    <!-- Static Netlify Forms Detection Form (Hidden from UI, detected at build time) -->
    <form name="scarselli-enquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="scarselli-enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="enquiryType" />
      <input type="date" name="preferredDate" />
      <input type="text" name="preferredTime" />
      <input type="text" name="pieceInterest" />
      <input type="text" name="savedPieces" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
